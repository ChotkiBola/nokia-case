<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nokia: ovoz berish</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
  :root { --bg:#07111f; --surface:#0d1b30; --line:#22385a; --text:#e8eef7; --muted:#8ea3bf; --accent:#ff4d5e; --ok:#2fe0b0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 Manrope, system-ui, sans-serif; padding:28px 16px 48px; }
  main { max-width:520px; margin:0 auto; }
  h1 { font:600 26px/1.2 Unbounded, system-ui, sans-serif; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .q { background:var(--surface); border-radius:18px; padding:22px 18px; margin-bottom:18px; }
  .q h2 { font-size:19px; margin:0 0 14px; }
  .opt { display:block; width:100%; text-align:left; margin-bottom:10px; padding:16px; border-radius:12px; border:0; cursor:pointer;
         background:#132641; color:var(--text); font:600 17px Manrope, sans-serif; box-shadow:inset 0 0 0 1.5px var(--line); }
  .opt:active { transform:scale(.99); }
  .opt[disabled] { cursor:default; opacity:.55; }
  .opt.mine { opacity:1; box-shadow:inset 0 0 0 2px var(--ok); }
  .done { color:var(--ok); font-weight:700; margin:6px 0 0; min-height:1.5em; }
  .err { color:var(--accent); }
  :focus-visible { outline:3px solid var(--ok); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>Nokia case study</h1>
  <p class="sub">Har bir savolga bitta ovoz bering. Natijalar katta ekranda darhol ko‘rinadi.</p>
  <div id="polls"></div>
</main>
<script>
const POLLS = {
  q1: { q: "2011-yilda Nokia qaysi yo‘lni tanlashi kerak edi?", opts: { android: "Android", wp: "Windows Phone", own: "O‘z tizimi (MeeGo)" } },
  q2: { q: "Nokia inqirozining asosiy sababi nima?", opts: { tech: "Texnologik kechikish", mgmt: "Boshqaruv va madaniyat", comp: "Kuchli raqobatchilar" } },
};
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const root = document.getElementById("polls");
Object.entries(POLLS).forEach(([id, p]) => {
  const box = document.createElement("section");
  box.className = "q";
  box.innerHTML = `<h2>${p.q}</h2>` + Object.entries(p.opts).map(([k, l]) => `<button class="opt" type="button" data-k="${k}">${l}</button>`).join("") + `<p class="done" aria-live="polite"></p>`;
  root.appendChild(box);
  const btns = [...box.querySelectorAll(".opt")], msg = box.querySelector(".done");
  const lock = mine => { btns.forEach(b => { b.disabled = true; b.classList.toggle("mine", b.dataset.k === mine); }); msg.className = "done"; msg.textContent = "Ovozingiz qabul qilindi."; };
  const prev = get("nokia-vote-" + id); if (prev) lock(prev);
  btns.forEach(b => b.addEventListener("click", async () => {
    btns.forEach(x => (x.disabled = true));
    try {
      const r = await fetch("/api/vote", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ poll: id, option: b.dataset.k }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Server xatosi");
      set("nokia-vote-" + id, b.dataset.k); lock(b.dataset.k);
    } catch (e) {
      btns.forEach(x => (x.disabled = false));
      msg.className = "done err"; msg.textContent = "Ovoz yuborilmadi: " + e.message + ". Qayta urinib ko‘ring.";
    }
  }));
});
</script>
</body>
</html>
